version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safesight-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safesight_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safesight_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safesight-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safesight-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safesight_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - YOLO_MODEL_PATH=/app/yolov8n.pt
      - YOLO_CONFIG_DIR=/app/.yolo
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./sample_data:/app/sample_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safesight-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safesight_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - YOLO_MODEL_PATH=/app/yolov8n.pt
      - YOLO_CONFIG_DIR=/app/.yolo
    volumes:
      - ./backend/storage:/app/storage
      - ./sample_data:/app/sample_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safesight-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
